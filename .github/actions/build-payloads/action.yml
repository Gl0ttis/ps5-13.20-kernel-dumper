name: Build PS5 payloads
description: >-
  Install LLVM 18 and the pinned ps5-payload-dev SDK, then build
  ps5-kernel-probe.elf (the dumper requires a machine-specific
  layout.json and is not built in CI).

inputs:
  sdk-version:
    description: ps5-payload-dev/sdk release tag to build against.
    required: false
    default: v0.45

runs:
  using: composite
  steps:
    - name: Install LLVM 18 toolchain
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang-18 lld-18 llvm-18 wget unzip

    - name: Download pinned PS5 Payload SDK (${{ inputs.sdk-version }})
      shell: bash
      run: |
        url="https://github.com/ps5-payload-dev/sdk/releases/download/${{ inputs.sdk-version }}/ps5-payload-sdk.zip"
        echo "Fetching $url"
        wget -q "$url" -O "${RUNNER_TEMP}/ps5-payload-sdk.zip"
        mkdir -p "${RUNNER_TEMP}/ps5-sdk"
        unzip -q "${RUNNER_TEMP}/ps5-payload-sdk.zip" -d "${RUNNER_TEMP}/ps5-sdk"

    - name: Build probe
      shell: bash
      env:
        LLVM_CONFIG: /usr/bin/llvm-config-18
      run: |
        set -euo pipefail
        sdk_mk="$(find "${RUNNER_TEMP}/ps5-sdk" -type f -path '*/toolchain/prospero.mk' | head -n1)"
        if [ -z "$sdk_mk" ]; then
          echo "::error::prospero.mk not found in the SDK archive" >&2
          exit 1
        fi
        export PS5_PAYLOAD_SDK="$(dirname "$(dirname "$sdk_mk")")"
        echo "PS5_PAYLOAD_SDK=$PS5_PAYLOAD_SDK"
        make probe
        test -f ps5-kernel-probe.elf
        echo "Built artifact:"
        ls -l ps5-kernel-probe.elf

    - name: Run Python tests
      shell: bash
      run: python3 -m unittest discover -s tests -v
